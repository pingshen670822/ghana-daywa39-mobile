<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>清除快取</title><style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--line:#dbe4ef;--brand:#0f766e;--hot:#b91c1c;--soft:#f6f8fb;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--soft);color:var(--ink);font-family:"Microsoft JhengHei",Arial,sans-serif;padding-bottom:86px}
    header{padding:18px 16px 14px;background:#111827;color:white;position:sticky;top:0;z-index:10;box-shadow:0 8px 20px rgba(15,23,42,.16)}
    h1{margin:0 0 6px;font-size:22px;letter-spacing:0}
    header p{margin:4px 0;color:#dbeafe;line-height:1.45;font-size:13px}
    main{padding:12px;max-width:720px;margin:0 auto}
    .band,.card,.number-card,.pack-card{background:white;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;overflow:auto}
    .launch-panel{border:3px solid #166534;background:#f0fdf4}
    .battle-539-exact{display:block}
    .primary{border:2px solid #b91c1c;background:#fff5f5}
    .strong{border:3px solid #b8860b;background:#fff8dc}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#7f1d1d;color:#fff;font-weight:900;margin-bottom:8px}
    .number{color:#b91c1c;font-size:54px;font-weight:900;line-height:1;margin:6px 0 8px;letter-spacing:0}
    .note{color:#64748b;font-weight:800}
    .battle-539-standard{background:#fff;border:3px solid #0f766e;border-radius:8px;margin-bottom:12px;overflow:hidden}
    .battle-539-title{background:#0f172a;color:#fff;padding:12px}
    .battle-539-title h2{color:#fff;margin:0 0 6px;font-size:20px}
    .battle-539-title p{margin:0;color:#d1fae5;font-weight:900}
    .battle-539-section{padding:12px;border-top:1px solid #dbe4ef;background:#fff}
    .battle-539-section>h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:#0f172a}
    .battle-539-section.hot{background:#fff1f2}
    .battle-539-section.warn{background:#fff7ed}
    .ultra-card{border:3px solid #b91c1c;background:#fff1f2}
    .warn{background:#fff7ed;border-color:#fed7aa}
    .warning{background:#fff8e6;border-color:#e9b949}
    .grid{display:grid;gap:10px}
    .interface-539-panel{border:3px solid #0f766e;background:#ecfdf5}
    .embedded-539{border-radius:8px;padding:10px;margin:8px 0}
    .interface-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .interface-card{border-color:#99f6e4;background:#ffffff}
    .interface-rule{margin:0 0 10px;font-weight:900;color:#14532d}
    .interface-sub{margin-top:6px;color:#475569;font-size:13px;font-weight:800;line-height:1.35}
    .label{color:var(--muted);font-size:13px;font-weight:800}
    .value{margin-top:5px;font-size:21px;font-weight:900;line-height:1.25;color:#0f172a;overflow-wrap:anywhere}
    .num{font-size:20px;font-weight:900;color:#b91c1c}
    h2{margin:0 0 10px;font-size:18px}
    h3{margin:12px 0 8px;font-size:16px}
    .launch-title{margin:0 0 10px;font-size:18px;font-weight:900}
    p{line-height:1.5}
    .mobile-action,.mobile-refresh{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border:0;border-radius:8px;font-weight:900;text-decoration:none}
    .mobile-action{background:#166534;color:#fff}
    .mobile-refresh{margin-top:10px;background:#1d4ed8;color:#fff;font-size:16px}
    .repair-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 8px}
    .repair-panel-actions{display:grid;gap:8px;margin:10px 0}
    .repair-actions button,.repair-actions a,.repair-panel-actions button,.repair-panel-actions a{appearance:none;display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:8px;padding:13px 8px;font-size:16px;font-weight:900;text-decoration:none;color:#fff;line-height:1.25}
    .manual-update{background:#1d4ed8}
    .instant-repair{background:#b91c1c}
    .cache-refresh{background:#166534}
    .report-return{background:#334155}
    .update-status-box{margin:10px 0 8px;padding:10px;border:1px solid #bbf7d0;border-radius:8px;background:#fff}
    .update-status-box .status-main{margin:4px 0 0;font-size:15px;color:#0f172a;font-weight:900;line-height:1.45}
    .update-status-box .status-sub{margin:5px 0 0;color:#14532d;font-size:13px;font-weight:900;line-height:1.45;word-break:break-word}
    .cloud-update-link{display:block;margin-top:12px;text-align:center;color:#1d4ed8;font-weight:900}
    .cloud-note{font-weight:800;color:#14532d;word-break:break-all}
    .quick-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
    .quick-links a{display:block;text-align:center;text-decoration:none;background:#0f766e;color:white;font-weight:900;border-radius:8px;padding:12px 8px}
    .quick-links a.secondary{background:#334155}
    table{width:100%;border-collapse:collapse;min-width:0;font-size:13px}
    th,td{border-bottom:1px solid #e5eaf2;padding:8px;text-align:left;vertical-align:top}
    th{background:#f1f5f9;color:#334155}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:6px}
    .bottom-nav a{text-decoration:none;color:#334155;text-align:center;font-size:12px;font-weight:900;padding:8px 4px;border-radius:7px;background:#f8fafc}
    .bottom-nav a.active{background:#0f766e;color:white}
    @media(max-width:720px){
      main{padding:10px}
      .band,.card,.number-card,.pack-card{padding:11px;margin-bottom:9px}
      .value{font-size:18px}
      table{min-width:0;font-size:14px;border-collapse:separate;border-spacing:0}
      table thead{display:none}
      table tbody,table tr,table td{display:block;width:100%}
      table tr{border:1px solid #e5eaf2;border-radius:8px;margin:8px 0;background:#fff;overflow:hidden}
      table td{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eef2f7;padding:9px 10px;text-align:right;word-break:break-word}
      table td:last-child{border-bottom:0}
      table td::before{content:attr(data-label);font-weight:900;color:#64748b;text-align:left;flex:0 0 42%;max-width:42%}
      table td[colspan]::before{content:""}
      .quick-links{grid-template-columns:repeat(2,minmax(0,1fr))}
      .repair-actions{grid-template-columns:1fr}
      .interface-grid{grid-template-columns:1fr 1fr}
    }
    </style></head><body><main><section class="band launch-panel"><h1>清除手機舊快取</h1><p>按下後會清除舊版雲端頁，重新回到最新首頁。</p><button class="mobile-refresh" onclick="forceRefresh()">清除並重新載入</button><div class="update-status-box" data-update-status="manual-complete-time"><div class="label">更新狀態</div><p class="status-main" id="mobileUpdateStatus">版本 20261007090454</p><p class="status-sub" id="lastManualUpdateStatus">最後手動更新完成：尚未在本手機執行</p></div></section></main>
    <script>
    window.GHANA39_BUILD_VERSION = '20261007090454';
    window.GHANA39_HOME_PAGE = 'home.html';
    window.GHANA39_GITHUB_LIVE_BASE = 'https://pingshen670822.github.io/ghana-daywa39-mobile';
    window.GHANA39_REPAIR_WORKFLOW_URL = 'https://github.com/pingshen670822/ghana-daywa39-mobile/actions/workflows/ghana39-cloud-self-repair.yml';
    function setMobileStatus(text) {
      var el = document.getElementById('mobileUpdateStatus');
      if (el) el.textContent = text;
    }
    function taiwanTimeText(value) {
      var date = value ? new Date(value) : new Date();
      try {
        return new Intl.DateTimeFormat('zh-TW', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).format(date).replace(/\//g, '-');
      } catch (err) {
        return date.toLocaleString();
      }
    }
    function renderLastUpdateStatus() {
      var el = document.getElementById('lastManualUpdateStatus');
      if (!el) return;
      var text = '最後手動更新完成：尚未在本手機執行';
      try {
        var raw = localStorage.getItem('ghana39_last_manual_update');
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.completedAt) {
            var parts = ['最後手動更新完成：' + taiwanTimeText(data.completedAt), '版本 ' + (data.version || window.GHANA39_BUILD_VERSION)];
            if (data.latest_draw_date) parts.push('資料日 ' + data.latest_draw_date);
            if (data.message) parts.push(data.message);
            text = parts.join(' / ');
          }
        }
      } catch (err) {}
      el.textContent = text;
    }
    function finalizeManualUpdateIfNeeded() {
      try {
        var params = new URLSearchParams(window.location.search || '');
        var pending = localStorage.getItem('ghana39_manual_update_pending');
        if (params.has('manual') || pending) {
          var pendingData = {};
          try { pendingData = pending ? JSON.parse(pending) : {}; } catch (err) { pendingData = {}; }
          var version = params.get('v') || window.GHANA39_BUILD_VERSION;
          localStorage.setItem('ghana39_last_manual_update', JSON.stringify({
            completedAt: new Date().toISOString(),
            version: version,
            page: currentMobilePage(),
            latest_draw_date: pendingData.latest_draw_date || '',
            status: pendingData.status || 'completed',
            message: pendingData.message || '已完成檢查'
          }));
          localStorage.removeItem('ghana39_manual_update_pending');
        }
      } catch (err) {}
      renderLastUpdateStatus();
    }
    function normalizeMobilePage(page) {
      if (!page || page === 'home' || page === 'index') return 'full-report.html';
      if (page.indexOf('.') === -1) return page + '.html';
      if (page === 'home.html' || page === 'index.html') return 'full-report.html';
      return page;
    }
    function currentMobilePage() {
      var path = window.location.pathname || '';
      var page = path.split('/').pop() || '';
      return normalizeMobilePage(page);
    }
    function normalizeCurrentMobileUrl() {
      var path = window.location.pathname || '';
      var page = path.split('/').pop() || '';
      var fixed = normalizeMobilePage(page);
      if (page !== fixed && window.history && window.history.replaceState) {
        var base = path.slice(0, Math.max(0, path.length - page.length));
        window.history.replaceState(null, document.title, base + fixed + window.location.search + window.location.hash);
      }
    }
    normalizeCurrentMobileUrl();
    async function clearMobileCaches() {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(async function(reg) {
          try {
            if (reg.active) reg.active.postMessage({ type: 'CLEAR_CACHE' });
            await reg.update();
            await reg.unregister();
          } catch (err) {}
        }));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(function(key) { return caches.delete(key); }));
      }
    }
    async function forceRefresh() {
      setMobileStatus('更新中 ' + new Date().toLocaleTimeString());
      await clearMobileCaches();
      location.replace(currentMobilePage() + '?v=20261007090454&force=' + Date.now());
    }
    function versionStamp(data) {
      return String((data && (data.version || data.generated_at_taiwan)) || '').replace(/\D/g, '').slice(0, 14);
    }
    function latestDrawText(data) {
      return String((data && (data.latest_draw_date || data.official_latest_draw_date)) || '');
    }
    async function fetchLiveVersion() {
      try {
        const live = await fetch(window.GHANA39_GITHUB_LIVE_BASE + '/version.json?manual=' + Date.now(), { cache: 'no-store', mode: 'cors', headers: { 'Cache-Control': 'no-cache' } });
        if (live.ok) return live.json();
      } catch (err) {}
      const local = await fetch('version.json?manual=' + Date.now(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
      if (!local.ok) throw new Error('local version failed');
      return local.json();
    }
    async function manualUpdateLatest() {
      setMobileStatus('手動更新檢查中 ' + taiwanTimeText());
      var stamp = '';
      var latestDraw = '';
      var status = 'completed';
      var message = '已完成檢查：目前雲端已是最新版本';
      try {
        const data = await fetchLiveVersion();
        stamp = versionStamp(data);
        latestDraw = latestDrawText(data);
        var currentStamp = versionStamp({ version: window.GHANA39_BUILD_VERSION });
        if (stamp && stamp !== currentStamp) {
          message = '發現雲端新版，已清除快取並重新載入';
          status = 'new_version_loaded';
        }
      } catch (err) {
        status = 'version_check_failed';
        message = '版本檢查失敗，已清除快取並重新載入本頁';
      }
      await clearMobileCaches();
      var nextVersion = stamp || window.GHANA39_BUILD_VERSION;
      try {
        localStorage.setItem('ghana39_manual_update_pending', JSON.stringify({
          startedAt: new Date().toISOString(),
          version: nextVersion,
          page: currentMobilePage(),
          latest_draw_date: latestDraw,
          status: status,
          message: message
        }));
      } catch (err) {}
      location.replace(currentMobilePage() + '?v=' + nextVersion + '&manual=' + Date.now());
    }
    function openRepairPanel() {
      location.href = 'repair.html?v=20261007090454&from=' + encodeURIComponent(currentMobilePage());
    }
    async function openCloudRepair() {
      setMobileStatus('當機修復啟動 ' + new Date().toLocaleTimeString());
      try {
        await clearMobileCaches();
      } catch (err) {}
      var opened = window.open(window.GHANA39_REPAIR_WORKFLOW_URL, '_blank', 'noopener,noreferrer');
      if (!opened) {
        location.href = window.GHANA39_REPAIR_WORKFLOW_URL;
      } else {
        setMobileStatus('已開啟雲端修復入口 ' + new Date().toLocaleTimeString());
      }
    }
    async function autoRefreshIfStale() {
      try {
        const res = await fetch('version.json?check=' + Date.now(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
        if (!res.ok) return;
        const data = await res.json();
        const stamp = String(data.version || data.generated_at_taiwan || '').replace(/\D/g, '').slice(0, 14);
        if (stamp && stamp !== window.GHANA39_BUILD_VERSION && !sessionStorage.getItem('ghana39_refreshed_' + stamp)) {
          sessionStorage.setItem('ghana39_refreshed_' + stamp, '1');
          await clearMobileCaches();
          location.replace(currentMobilePage() + '?v=' + stamp + '&auto=' + Date.now());
        }
      } catch (err) {}
    }
    finalizeManualUpdateIfNeeded();
    autoRefreshIfStale();
    window.addEventListener('pageshow', function() { finalizeManualUpdateIfNeeded(); autoRefreshIfStale(); });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('service-worker.js?v=20261007090454', { updateViaCache: 'none' }).then(function(reg){ reg.update(); }).catch(function(){});
        autoRefreshIfStale();
        setInterval(autoRefreshIfStale, 30000);
      });
      document.addEventListener('visibilitychange', function() { if (!document.hidden) autoRefreshIfStale(); });
      window.addEventListener('online', autoRefreshIfStale);
    } else {
      window.addEventListener('load', autoRefreshIfStale);
      setInterval(autoRefreshIfStale, 30000);
    }
    </script>
    </body></html>
